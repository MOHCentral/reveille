# SPDX-License-Identifier: GPL-3.0-only

[workspace]
members = [
    "crates/reveille-core",
    "crates/reveille-platform",
    "crates/reveille-cli",
    "crates/reveille-app",
]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-only"
# Equal to `rust-toolchain.toml`'s channel, and `tools/check-sources.mjs` requires it to stay so.
# The two disagreeing is how an MSRV claim nobody compiles against gets published.
rust-version = "1.98.1"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
md-5 = "0.10"
proptest = { version = "1.7", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.50", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.24", features = ["serde", "v4", "v7"] }
walkdir = "2.5"
zeroize = "1.8"
winreg = "0.56"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
