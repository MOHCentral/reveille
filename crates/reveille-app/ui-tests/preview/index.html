<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reveille preview</title>
  </head>
  <body>
    <!--
      Loads the real shell from ui/ against a fake Tauri bridge and a fixed server list, so the
      interface can be looked at in any browser. Serve crates/reveille-app over HTTP and open
      /ui-tests/preview/. ?favorites=3 stars the first three servers; ?watch=2
      watches the second and third, plus one server the list lacks;
      ?history=4 records four played servers; ?games=3 makes all three games playable; ?drift=1
      moves player counts on every sweep after the first; ?section=content opens Maps & mods,
      ?layout=list draws it as a list, ?tab=mods or ?tab=installed picks that tab, ?played=1
      turns Played now on, ?downloading=4301 holds that map's install at 62%, ?admin=2 adds two
      servers to Admin (?section=admin opens it), and ?adminfail=needs_password fails the first
      one's status that way.
    -->
    <script type="module" src="preview.js"></script>
  </body>
</html>
