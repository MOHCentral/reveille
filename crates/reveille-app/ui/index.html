<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reveille</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/shell.css" />
    <link rel="stylesheet" href="features/servers/servers.css" />
    <link rel="stylesheet" href="features/join/join.css" />
    <link rel="stylesheet" href="features/setup/setup.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
  </head>
  <body>
    <div class="shell hidden" id="shell">
      <header class="titlebar">
        <span class="wordmark">Reveille</span>
        <button type="button" id="game-switch" class="game-switch" aria-haspopup="menu">
          <span class="game-switch__game" id="game-switch-game"></span>
          <span class="game-switch__engine" id="game-switch-engine"></span>
          <span class="game-switch__caret" aria-hidden="true">▾</span>
        </button>
        <span class="titlebar__spacer"></span>
        <button type="button" id="reveille-update-btn" class="btn btn--sm btn--primary hidden">
          Update Reveille
        </button>
        <button
          type="button"
          id="arrival-events-btn"
          class="titlebar__icon"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-label="Player alerts"
          title="Player alerts"
        >
          <span id="arrival-unread" class="arrival-unread hidden"></span>
        </button>
        <button type="button" id="settings-btn" class="titlebar__icon" aria-label="Settings" title="Settings"></button>
        <button
          type="button"
          id="more-btn"
          class="titlebar__icon"
          aria-haspopup="menu"
          aria-label="More"
          title="More"
        ></button>
      </header>

      <div id="toolbar-slot"></div>

      <main class="split">
        <div id="list-slot"></div>
        <aside class="detail-pane" id="detail-slot" aria-label="Selected server"></aside>
      </main>

      <div id="status-slot"></div>
    </div>

    <div class="setup-root" id="setup-root"></div>

    <dialog id="info-dialog" aria-labelledby="info-dialog-title">
      <div class="dialog__head">
        <!-- Set by lib/dialog.js: one modal serves every panel. -->
        <h2 class="display heading-sm" id="info-dialog-title"></h2>
      </div>
      <div class="dialog__body" id="info-dialog-body"></div>
      <div class="dialog__foot">
        <button type="button" class="btn" id="info-dialog-close" autofocus>Close</button>
      </div>
    </dialog>

    <dialog id="setup-dialog" aria-labelledby="setup-dialog-title">
      <div class="dialog__head">
        <h2 class="display heading-sm" id="setup-dialog-title">Game folder and program</h2>
      </div>
      <!-- Filled by views/setup.js, which draws the same folder and program choice as the first run. -->
      <div class="dialog__body" data-setup-body></div>
      <div class="dialog__foot" data-setup-foot></div>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
