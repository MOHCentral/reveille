# SPDX-License-Identifier: GPL-3.0-only

name: Supply-chain security

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow correctness and security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
          version: v1.30.1

      # actionlint complements zizmor with schema, expression, and embedded-shell checks.
      - name: Run actionlint
        uses: nicholas-fedor/actionlint-action@6e754b24ec9c9714fe66f4d7e01b4affe417cd35 # v1.0.19
        with:
          version: "1.7.12"
          # actionlint 1.7.12 predates GitHub's July 2026 self-repository syntax.
          ignore: 'reusable workflow call.*ci\.yml'

  rust-dependencies:
    name: Rust advisories and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep these checks identical to `just dependency-security`; the action only supplies a
      # cached cargo-deny, and passes `--all-features` by default.
      - name: Check advisories, duplicate baseline, sources, and licences
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories bans sources licenses
